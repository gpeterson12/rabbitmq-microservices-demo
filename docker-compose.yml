name: rabbitmq-microservices-demo

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    restart: unless-stopped
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
    ports:
      - "5001:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/Dockerfile
    restart: unless-stopped
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      Consuming__PrefetchCount: ${CONSUMING_PREFETCH_COUNT:-16}
      Consuming__ConsumerDispatchConcurrency: ${CONSUMING_DISPATCH_CONCURRENCY:-8}
      Consuming__SimulatedProcessingDelayEnabled: ${SIMULATED_PROCESSING_DELAY_ENABLED:-true}
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    restart: unless-stopped
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      Consuming__PrefetchCount: ${CONSUMING_PREFETCH_COUNT:-16}
      Consuming__ConsumerDispatchConcurrency: ${CONSUMING_DISPATCH_CONCURRENCY:-8}
    ports:
      - "5003:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
